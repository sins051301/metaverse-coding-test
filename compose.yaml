services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: coding_test
      MYSQL_USER: coding_test
      MYSQL_PASSWORD: coding_test
      MYSQL_ROOT_PASSWORD: root
    # 이 PC에 직접 설치한 MySQL이 3306을 쓰고 있어서 호스트 쪽은 3307로 연다.
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
