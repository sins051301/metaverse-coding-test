spring.application.name=backend
spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:mysql://localhost:3307/coding_test
spring.datasource.username=coding_test
spring.datasource.password=coding_test

# 테이블은 Flyway(db/migration)가 만들고, JPA는 엔티티와 테이블이 맞는지만 확인한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# 400(요청 검증 실패)·404 같은 에러 응답을 표준 형식(RFC 9457 ProblemDetail)으로 돌려준다.
spring.mvc.problemdetails.enabled=true

# 비밀값은 환경 변수로만 받는다(공개 레포). 값이 없으면 서버가 시작하지 않는다.
# 로컬에서는 git 에 올라가지 않는 backend/.env 파일(KEY=값 형식)에 적어 두면 읽는다. 파일이 없으면 무시한다.
spring.config.import=optional:file:.env[.properties]
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email
jwt.secret=${JWT_SECRET}
jwt.expiration=24h

# 채점 부하 제한. 모두 임시값이며 근거와 조정 계획은 README 7장, docs/tuning.md.
# 동시에 채점(컨테이너 실행)하는 최대 수. 제출과 실행을 합친 수다.
judge.concurrency=4
# 끝나지 않은(PENDING·JUDGING) 제출+실행이 이만큼 쌓이면 새 접수를 429 로 거절한다.
judge.queue-capacity=50
# 한 유저의 끝나지 않은 제출+실행이 이만큼이면 새 접수를 429 로 거절한다.
judge.per-user-unfinished-limit=2
judge.docker.connection-timeout=3s
judge.docker.response-timeout=2m
