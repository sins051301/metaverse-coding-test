spring.application.name=backend
spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:mysql://localhost:3307/coding_test
spring.datasource.username=coding_test
spring.datasource.password=coding_test

# 테이블은 Flyway(db/migration)가 만들고, JPA는 엔티티와 테이블이 맞는지만 확인한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# 400(요청 검증 실패)·404 같은 에러 응답을 표준 형식(RFC 9457 ProblemDetail)으로 돌려준다.
spring.mvc.problemdetails.enabled=true
