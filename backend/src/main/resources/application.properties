spring.application.name=backend
spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:mysql://localhost:3307/coding_test
spring.datasource.username=coding_test
spring.datasource.password=coding_test

# 테이블은 Flyway(db/migration)가 만들고, JPA는 엔티티와 테이블이 맞는지만 확인한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# 같은 INSERT 를 모아 JDBC 배치로 보낸다. 채점 결과(테스트 수만큼의 행)를 저장할 때 쓰인다. 한 문제의 테스트는 지금 최대 35개 (docs/tuning.md)
spring.jpa.properties.hibernate.jdbc.batch_size=50
# MySQL 드라이버는 이 옵션이 없으면 배치로 받은 INSERT 도 한 문장씩 보낸다. 켜면 INSERT ... VALUES (...), (...) 한 문장으로 합쳐 보낸다.
# URL 이 아니라 커넥션 풀 속성으로 줘서 운영(SPRING_DATASOURCE_URL)·테스트(Testcontainers) 주소가 달라도 똑같이 적용된다
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
# 드라이버가 배치를 보낼 때마다 SELECT @@session.transaction_read_only 로 서버에 읽기 전용 여부를 묻지 않고, 드라이버가 기억한 상태를 쓴다
spring.datasource.hikari.data-source-properties.useLocalSessionState=true

# 400(요청 검증 실패)·404 같은 에러 응답을 표준 형식(RFC 9457 ProblemDetail)으로 돌려준다.
spring.mvc.problemdetails.enabled=true

# 비밀값은 환경 변수로만 받는다(공개 레포). 값이 없으면 서버가 시작하지 않는다.
# 로컬에서는 git 에 올라가지 않는 backend/.env 파일(KEY=값 형식)에 적어 두면 읽는다. 파일이 없으면 무시한다.
spring.config.import=optional:file:.env[.properties]
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email
jwt.secret=${JWT_SECRET}
jwt.expiration=24h
# Google 로그인 성공 후 토큰을 붙여 돌려보낼 프론트엔드 주소 (LoginSuccessHandler)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
# 토큰 쿠키를 HTTPS 에서만 보낼지 (AccessTokenCookie). 로컬은 http 라 false, 배포에서는 true
app.cookie-secure=${COOKIE_SECURE:false}

# 채점 부하 제한. 모두 임시값이며 근거와 조정 계획은 README 7장, docs/tuning.md.
# 동시에 채점(컨테이너 실행)하는 최대 수. 제출과 실행을 합친 수다.
judge.concurrency=4
# 끝나지 않은(PENDING·JUDGING) 제출+실행이 이만큼 쌓이면 새 접수를 429 로 거절한다.
judge.queue-capacity=50
# 한 유저의 끝나지 않은 제출+실행이 이만큼이면 새 접수를 409 로 거절한다.
judge.per-user-unfinished-limit=1
# 채점 작업 스레드를 가상 스레드로 만들지. false 는 플랫폼 스레드와 비교 측정할 때만 쓴다 (threadBenchmark, concurrencyTest -PjudgeVirtualThreads=false)
judge.virtual-threads=true
judge.docker.connection-timeout=3s
judge.docker.response-timeout=2m

# 지표 노출. Prometheus 가 /actuator/prometheus 를 주기적으로 가져간다
management.endpoints.web.exposure.include=health,prometheus
# HTTP 응답 시간을 구간별 개수(히스토그램)로도 내보내야 Prometheus 에서 p95 같은 백분위를 계산할 수 있다
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# 책상 주인(회원)·페어 상대의 연결이 끊겼을 때 방과 페어를 남겨 두고 기다리는 시간. 그 안에 다시 연결되면 이어 간다 (docs/tuning.md)
lounge.desk.reconnect-grace=15s

# Tomcat 이 WebSocket 메시지를 받는 버퍼(기본 8KB). 이보다 큰 메시지는 STOMP 까지 가기 전에 연결이 끊긴다(1009 Message Too Big).
# 관전 문서처럼 큰 메시지를 위해 STOMP 크기 제한(LoungeWebSocketConfiguration, 512KB)과 맞춘다.
# 빈(ServletServerContainerFactoryBean)으로 주면 실제 서버 없이 뜨는 테스트(MockMvc)에서 컨텍스트 생성이 실패해서 Tomcat 설정값으로 준다
server.servlet.context-parameters[org.apache.tomcat.websocket.textBufferSize]=524288
server.servlet.context-parameters[org.apache.tomcat.websocket.binaryBufferSize]=524288
