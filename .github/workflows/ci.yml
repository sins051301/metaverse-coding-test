name: CI

on:
  push:
  pull_request:

jobs:
  backend-test:
    name: 일반 테스트
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  judge-test:
    name: 채점 테스트 (실제 컨테이너)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # 러너 유저의 uid 가 채점 컨테이너의 sandbox(uid 1001)와 같으면 폴더 권한 문제가 가려진다. 그래서 아래 운영 구성 점검을 따로 둔다
      - run: id
      - run: ./gradlew judgeTest

  production-smoke:
    name: 운영 구성 점검 (compose.prod.yaml)
    runs-on: ubuntu-24.04
    env:
      JWT_SECRET: ci-jwt-secret-that-is-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v4
      - name: 채점 이미지 빌드
        working-directory: docker/judge
        run: |
          docker build -q -f java.Dockerfile -t coding-test/judge-java .
          docker build -q -f javascript.Dockerfile -t coding-test/judge-javascript .
      - name: 점검용 .env
        run: |
          cat > ci.env <<EOF
          SITE_ADDRESS=:80
          PUBLIC_URL=http://localhost
          COOKIE_SECURE=false
          MYSQL_PASSWORD=ci-password
          MYSQL_ROOT_PASSWORD=ci-root-password
          GOOGLE_CLIENT_ID=ci-client-id
          GOOGLE_CLIENT_SECRET=ci-client-secret
          JWT_SECRET=${JWT_SECRET}
          EOF
      - name: 운영 구성 실행
        run: docker compose -f compose.prod.yaml --env-file ci.env up -d --build
      - name: backend 준비 대기
        run: |
          for attempt in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/problems)" = "200" ]; then exit 0; fi
            sleep 3
          done
          docker compose -f compose.prod.yaml --env-file ci.env logs backend
          exit 1
      - name: 점검용 유저
        run: |
          docker compose -f compose.prod.yaml --env-file ci.env exec -T mysql \
            mysql -uroot -pci-root-password coding_test \
            -e "INSERT INTO users (google_subject, email, nickname, created_at) VALUES ('ci-subject', 'ci@example.invalid', 'ci', UTC_TIMESTAMP())"
          echo "USER_ID=$(docker compose -f compose.prod.yaml --env-file ci.env exec -T mysql mysql -N -uroot -pci-root-password coding_test -e "SELECT id FROM users WHERE google_subject = 'ci-subject'")" >> "$GITHUB_ENV"
      - name: 제출 채점·경로 점검
        run: BASE_URL=http://localhost node deploy/smoke-test.mjs
      - name: 실패 시 로그
        if: failure()
        run: docker compose -f compose.prod.yaml --env-file ci.env logs
