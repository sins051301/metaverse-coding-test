# 운영 배포용 (오라클 서버 한 대). 로컬 개발용 MySQL 은 compose.yaml.
# 실행: deploy/.env.example 을 .env 로 복사해 값을 채운 뒤
#   docker compose -f compose.prod.yaml --env-file .env up -d --build
# 채점 이미지(coding-test/judge-*)는 같은 서버에서 먼저 빌드해 둔다 (docs/deployment.md).

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: coding_test
      MYSQL_USER: coding_test
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 를 .env 에 적으세요}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 를 .env 에 적으세요}
      # Grafana 읽기 전용 계정 비밀번호. 계정을 만드는 스크립트만 쓴다 (docs/deployment.md "모니터링")
      GRAFANA_MYSQL_PASSWORD: ${GRAFANA_MYSQL_PASSWORD:?GRAFANA_MYSQL_PASSWORD 를 .env 에 적으세요}
    # 포트를 열지 않는다. 같은 compose 네트워크의 backend·grafana 만 접속한다
    volumes:
      - mysql-data:/var/lib/mysql
      - ./monitoring/mysql/create-grafana-reader.sh:/docker-entrypoint-initdb.d/create-grafana-reader.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/coding_test
      SPRING_DATASOURCE_USERNAME: coding_test
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID 를 .env 에 적으세요}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET 를 .env 에 적으세요}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 를 .env 에 적으세요}
      FRONTEND_URL: ${PUBLIC_URL:?PUBLIC_URL 을 .env 에 적으세요}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Caddy 가 붙여 주는 X-Forwarded-* 를 믿어 OAuth 리디렉션 주소를 https://도메인 으로 만든다.
      # backend 는 포트를 열지 않아 Caddy 를 거치지 않은 요청이 들어올 수 없으므로 믿어도 된다
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # 채점 입력 파일을 이 폴더에 쓰고, 호스트 Docker 가 같은 경로를 채점 컨테이너에 연결한다 (아래 volumes 참고)
      JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=/var/lib/coding-test/judge
    volumes:
      # 채점 컨테이너를 만들기 위해 호스트 Docker 를 쓴다. 이 소켓을 가진 컨테이너는 호스트 root 권한과 같다 (docs/deployment.md "보안")
      - /var/run/docker.sock:/var/run/docker.sock
      # 채점 컨테이너의 bind mount 경로는 호스트 기준으로 해석되므로 호스트와 컨테이너에서 경로를 똑같이 맞춘다
      - /var/lib/coding-test/judge:/var/lib/coding-test/judge

  caddy:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS 를 .env 에 적으세요}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # 모니터링. 두 포트 모두 서버 안(127.0.0.1)에만 열어 외부에서는 닿지 않는다. 내 PC 에서는 SSH 터널로 본다 (docs/deployment.md "모니터링")
  # backend 의 /actuator 는 Caddy 가 넘기지 않으므로 같은 compose 네트워크의 Prometheus 만 가져갈 수 있다
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    depends_on:
      - backend
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    depends_on:
      - prometheus
      - mysql
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 를 .env 에 적으세요}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/judge.json
      GRAFANA_MYSQL_PASSWORD: ${GRAFANA_MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
