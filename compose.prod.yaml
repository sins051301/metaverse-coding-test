# 운영 배포용 (오라클 서버 한 대). 로컬 개발용 MySQL 은 compose.yaml.
# 실행: deploy/.env.example 을 .env 로 복사해 값을 채운 뒤
#   docker compose -f compose.prod.yaml --env-file .env up -d --build
# 채점 이미지(coding-test/judge-*)는 같은 서버에서 먼저 빌드해 둔다 (docs/deployment.md).

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: coding_test
      MYSQL_USER: coding_test
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 를 .env 에 적으세요}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 를 .env 에 적으세요}
    # 포트를 열지 않는다. 같은 compose 네트워크의 backend 만 접속한다
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/coding_test
      SPRING_DATASOURCE_USERNAME: coding_test
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID 를 .env 에 적으세요}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET 를 .env 에 적으세요}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 를 .env 에 적으세요}
      FRONTEND_URL: ${PUBLIC_URL:?PUBLIC_URL 을 .env 에 적으세요}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Caddy 가 붙여 주는 X-Forwarded-* 를 믿어 OAuth 리디렉션 주소를 https://도메인 으로 만든다.
      # backend 는 포트를 열지 않아 Caddy 를 거치지 않은 요청이 들어올 수 없으므로 믿어도 된다
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # 채점 입력 파일을 이 폴더에 쓰고, 호스트 Docker 가 같은 경로를 채점 컨테이너에 연결한다 (아래 volumes 참고)
      JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=/var/lib/coding-test/judge
    volumes:
      # 채점 컨테이너를 만들기 위해 호스트 Docker 를 쓴다. 이 소켓을 가진 컨테이너는 호스트 root 권한과 같다 (docs/deployment.md "보안")
      - /var/run/docker.sock:/var/run/docker.sock
      # 채점 컨테이너의 bind mount 경로는 호스트 기준으로 해석되므로 호스트와 컨테이너에서 경로를 똑같이 맞춘다
      - /var/lib/coding-test/judge:/var/lib/coding-test/judge

  caddy:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS 를 .env 에 적으세요}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # 모니터링. 대시보드는 Grafana Cloud 에서 본다 (docs/deployment.md "모니터링").
  # 서버 Prometheus 가 5초마다 모으고, 대시보드가 쓰는 시계열만 remote_write 로 Grafana Cloud 에 복사한다.
  # 무료 한도(활성 시계열 1만 개)가 전송 빈도(DPM)까지 세므로, 시계열이 가장 많은 HTTP 히스토그램은 제출·실행 접수 API 것만 보낸다 (약 420개 × 분당 12회).
  # 9090 은 서버 안(127.0.0.1)에만 연다. 5초 해상도 원본이나 걸러 낸 지표가 필요할 때(부하 테스트 등) SSH 터널로 Prometheus 화면에서 본다
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    depends_on:
      - backend
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus-data:/prometheus

configs:
  prometheus-config:
    content: |
      global:
        scrape_interval: 5s
        evaluation_interval: 5s

      scrape_configs:
        - job_name: backend
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ["backend:8080"]

      remote_write:
        - url: ${GRAFANA_CLOUD_PROMETHEUS_URL:?GRAFANA_CLOUD_PROMETHEUS_URL 을 .env 에 적으세요}
          basic_auth:
            username: ${GRAFANA_CLOUD_PROMETHEUS_USER:?GRAFANA_CLOUD_PROMETHEUS_USER 를 .env 에 적으세요}
            password: ${GRAFANA_CLOUD_PROMETHEUS_TOKEN:?GRAFANA_CLOUD_PROMETHEUS_TOKEN 을 .env 에 적으세요}
          write_relabel_configs:
            - source_labels: [__name__, method, uri]
              regex: "(judge_.+|hikaricp_connections_(active|idle|max|pending)|http_server_requests_seconds_count|jvm_memory_used_bytes|jvm_threads_live_threads|process_cpu_usage|system_cpu_usage|up);.*|http_server_requests_seconds_bucket;POST;/api/problems/[^/]*/(submissions|runs)"
              action: keep

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
  prometheus-data:
