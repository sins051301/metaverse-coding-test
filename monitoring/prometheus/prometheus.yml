# 로컬(compose.yaml) 전용. 로컬은 extra_hosts 로 backend 이름을 호스트(bootRun)에 연결한다.
# 운영 설정은 Grafana Cloud 로 보내는 remote_write 가 붙어서 compose.prod.yaml 의 configs 에 따로 있다. 수집 설정을 바꾸면 둘 다 고친다.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
